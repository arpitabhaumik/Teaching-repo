<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quick knowledge check</title>
<style>
:root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#172033;background:#f5f7ff}*{box-sizing:border-box}body{margin:0;padding:28px 16px}.panel{max-width:680px;margin:5vh auto;background:#fff;border:1px solid #e2e8f0;border-radius:20px;padding:clamp(22px,5vw,38px);box-shadow:0 12px 34px #1e293b12}.tag{color:#4338ca;font-size:.78rem;font-weight:750;text-transform:uppercase;letter-spacing:.12em}h1{margin:10px 0}.muted{color:#64748b;line-height:1.6}.question{font-size:1.2rem;font-weight:700;margin:26px 0 16px}.answers{display:grid;gap:10px}.answers button{padding:14px 16px;text-align:left;background:#fff;border:1px solid #cbd5e1;border-radius:12px;font:inherit;cursor:pointer}.answers button:hover{border-color:#6366f1;background:#f5f3ff}.answers button:disabled{cursor:default;opacity:1}.answers button.correct{border-color:#16a34a;background:#f0fdf4}.answers button.wrong{border-color:#dc2626;background:#fef2f2}#feedback{min-height:52px;margin-top:16px;font-weight:650;line-height:1.5}.next{background:#4338ca;color:white;border:0;border-radius:10px;padding:11px 16px;font:inherit;font-weight:650;cursor:pointer}.next:disabled{opacity:.4;cursor:not-allowed}.top{display:flex;justify-content:space-between;gap:12px;color:#64748b;font-size:.9rem}.back{color:#4338ca;text-decoration:none}
</style>
</head>
<body><main class="panel">
<div class="top"><span class="tag">Practice activity</span><span id="progress">Question 1 of 3</span></div>
<h1>Quick knowledge check</h1><p class="muted">Choose an answer for each question. You’ll get instant feedback as you go.</p>
<div class="question" id="question"></div><div class="answers" id="answers"></div><div id="feedback" role="status" aria-live="polite"></div><button class="next" id="next" disabled>Next question</button>
<p class="muted" id="score" hidden></p><p><a class="back" href="../">← Back to all activities</a></p>
</main>
<script>
const questions=[
 {q:"Which planet is known as the Red Planet?",a:["Venus","Mars","Jupiter"],correct:1,why:"Mars looks reddish because iron-rich minerals in its soil have rusted."},
 {q:"What is 8 × 7?",a:["54","56","64"],correct:1,why:"8 groups of 7 make 56."},
 {q:"Which part of a plant usually absorbs water from the soil?",a:["Roots","Flowers","Leaves"],correct:0,why:"Roots take up water and minerals from the soil."}
];
let current=0,score=0,answered=false;
const q=document.querySelector("#question"),answers=document.querySelector("#answers"),feedback=document.querySelector("#feedback"),next=document.querySelector("#next"),progress=document.querySelector("#progress"),scoreLine=document.querySelector("#score");
function render(){const item=questions[current];answered=false;progress.textContent="Question "+(current+1)+" of "+questions.length;q.textContent=item.q;answers.innerHTML="";feedback.textContent="";next.disabled=true;next.textContent=current===questions.length-1?"See results":"Next question";item.a.forEach((answer,i)=>{const b=document.createElement("button");b.textContent=answer;b.addEventListener("click",()=>choose(i));answers.appendChild(b)});}
function choose(i){if(answered)return;answered=true;const item=questions[current];const buttons=[...answers.children];buttons.forEach((b,j)=>{b.disabled=true;if(j===item.correct)b.classList.add("correct");else if(j===i)b.classList.add("wrong")});if(i===item.correct){score++;feedback.textContent="Correct! "+item.why}else{feedback.textContent="Not quite. "+item.why}next.disabled=false;}
next.addEventListener("click",()=>{if(!answered)return;if(current<questions.length-1){current++;render()}else{q.textContent="You’ve completed the activity!";answers.innerHTML="";feedback.textContent="";progress.textContent="Complete";next.hidden=true;scoreLine.hidden=false;scoreLine.textContent="Your score: "+score+" out of "+questions.length+". "+(score===questions.length?"Excellent work!":"Good effort — have another go to improve your score.");}});
render();
</script></body></html>
